<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rich Text to Markdown</title>
  </head>
  <body>
    <div class="card">
      <h1>Rich Text to Markdown Converter</h1>
      <p>Paste rich text directly from Gemini, Google Docs, or webpages. The clipboard's HTML will be automatically intercepted and converted.</p>
      
      <div class="tabs">
        <button class="tab-btn active" id="tab-markdown">Markdown Editor</button>
        <button class="tab-btn" id="tab-preview">Live Preview</button>
      </div>

      <div id="markdown-view" class="view-wrapper active">
        <textarea id="markdown-area" placeholder="Tap here and paste your rich text..."></textarea>
        
        <div class="flex-row">
          <button id="copy-btn" class="primary-btn">Copy Markdown</button>
          <button id="clear-btn" class="secondary-btn">Clear</button>
        </div>
      </div>

      <div id="preview-view" class="view-wrapper">
        <div id="preview-content"></div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
